<svg xmlns="http://www.w3.org/2000/svg" width="880" height="72" viewBox="0 0 880 72" role="img" aria-label="Redline tagline animation">
  <rect width="880" height="72" rx="12" fill="#0f1720"/>
  <text x="28" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#9fb3c8">
    The cleanup can change what you said.
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.35;0.42;0.58;0.65;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#4ea1ff">
    Redline shows you when it does.
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.42;0.58;0.65;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <rect x="28" y="54" width="10" height="3" rx="1" fill="#4ea1ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
